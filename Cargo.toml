[package]
name = "ogmara-push-gateway"
version = "0.8.0"
edition = "2021"
authors = ["Ogmara Contributors"]
license = "MIT"
description = "Ogmara push notification gateway — bridges L2 mentions to FCM, APNs, and Web Push"
publish = false

[[bin]]
name = "ogmara-push-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP framework (device registration API)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (push provider APIs)
reqwest = { version = "0.13", features = ["json"] }

# Concurrency utilities (fan-out push sends — audit 2026-06-07 W6)
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"

# Configuration
toml = "1.1"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Cryptography (JWT signing for FCM/APNs/VAPID)
# RS256 (FCM service-account JWT) uses aws-lc-rs, not the pure-Rust `rsa` crate:
# `rsa` 0.9.x has an unfixed timing sidechannel (RUSTSEC-2023-0071 Marvin Attack)
# with no patched release. aws-lc-rs is already in the tree via rustls.
aws-lc-rs = "1.16"
sha2 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# Klever wallet signature verification for device registration (audit 2026-06-07)
ed25519-dalek = "2.2"
sha3 = "0.10"               # Keccak-256 (Klever message signing format)
bech32 = "0.11"            # klv1.../ogd1... address decoding

# Web Push encryption (RFC 8291)
ece = "2.3"

# Token-at-rest encryption for the device registry (audit 2026-06-07 W3)
aes-gcm = "0.10"

# Robust URL parsing for the Web Push SSRF allowlist (audit 2026-06-07 W7)
url = "2.5"

# Utilities
urlencoding = "2.1"
hex = "0.4"
dashmap = "6.1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.50", features = ["test-util", "macros"] }
